name: Godot 4.3 - public CI
on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
permissions:
  contents: read
concurrency:
  group: 'godot-public-${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  import-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 and runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          echo '7de56444b130b10af84d19c7e0cf63cf9e9937ee4ba94364c3b7dd114253ca21  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dri libxinerama1 libxcursor1 libxi6 libxrandr2 libasound2
          echo '/tmp/godot' >> "$GITHUB_PATH"
      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource|ERROR:.*(parse|import)' /tmp/godot-import.log; then exit 1; fi
      - name: Headless domain and regression checks
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/dev03_domain.gd -- --test-mode 2>&1 | tee /tmp/godot-domain.log
          Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/career_transactions.gd -- --test-mode 2>&1 | tee /tmp/godot-career.log
          Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/prototype_music_smoke.gd -- --test-mode 2>&1 | tee /tmp/godot-audio.log
          Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/dev05_inspection.gd -- --test-mode 2>&1 | tee /tmp/godot-dev05.log
          Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/geo01_corner_junctions.gd -- --test-mode 2>&1 | tee /tmp/godot-geo01.log
          Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/dialogue_ui.gd -- --test-mode 2>&1 | tee /tmp/godot-dialogue.log
          Godot_v4.3-stable_linux.x86_64 --headless --path . --script tests/dialogue_ui01.gd -- --test-mode 2>&1 | tee /tmp/godot-dialogue-ui01.log
          if grep -E 'SCRIPT ERROR|Parse Error|FAIL:' /tmp/godot-dialogue.log /tmp/godot-dialogue-ui01.log /tmp/godot-domain.log /tmp/godot-career.log /tmp/godot-audio.log /tmp/godot-dev05.log /tmp/godot-geo01.log; then exit 1; fi
          grep -E 'DEV05 INSPECTION: [0-9]+ checks; 0 failures' /tmp/godot-dev05.log
          grep -E 'GEO01 CORNERS: [0-9]+ checks; 0 failures' /tmp/godot-geo01.log
          grep -E 'DIALOGUE UI01: [0-9]+ checks; 0 failures' /tmp/godot-dialogue-ui01.log
