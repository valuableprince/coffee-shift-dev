name: Build and publish SEVER FM radio prop

on:
  push:
    branches:
      - feat/prop-radio-sever-fm
    paths:
      - .github/workflows/radio-asset-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-radio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic model-building dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.3.5 trimesh==4.11.1 Pillow==12.3.0 brotli==1.2.0
      - name: Recover validated source package (first run only)
        run: |
          python - <<'PY'
          import base64, brotli, hashlib, io, tarfile
          from pathlib import Path
          source = Path('tools/radio_receiver_source.tar.br.b64')
          if not source.exists():
              assert Path('assets/models/radio_receiver/radio_receiver_generator.py').is_file()
              print('Original generator already committed; rebuilding')
          else:
              data = base64.b64decode(source.read_text().strip(), validate=True)
              expected = '8ea7cdd5e2d523fecb1849a402fed2e5a0b5cc9962627f8e76ad32823b2817ca'
              assert hashlib.sha256(data).hexdigest() == expected, 'Source archive checksum differs'
              allowed = {
                  'tests/test_radio_receiver.py',
                  'assets/models/radio_receiver/RADIO_README.md',
                  'assets/models/radio_receiver/radio_receiver_generator.py',
                  'assets/models/radio_receiver/radio_receiver.tscn',
                  'assets/models/radio_receiver/radio_model_manifest.json',
              }
              with tarfile.open(fileobj=io.BytesIO(brotli.decompress(data)), mode='r:') as archive:
                  members = archive.getmembers()
                  assert {m.name for m in members} == allowed
                  assert all(m.isfile() and m.size < 30000 for m in members)
                  for member in members:
                      dest = Path(member.name)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(archive.extractfile(member).read())
              print('Verified and recovered', len(allowed), 'source files')
          PY
      - name: Generate original GLB and textures
        run: python assets/models/radio_receiver/radio_receiver_generator.py
      - name: Verify GLB, layout and test
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, runpy
          root = Path('assets/models/radio_receiver')
          runpy.run_path('tests/test_radio_receiver.py')['run_test'](root)
          digest = hashlib.sha256((root/'coffee_shift_radio_receiver.glb').read_bytes()).hexdigest()
          print('GLB sha256:', digest)
          assert digest == '204d6569d7c22ed68c738eb1a24e3fa0a3d87f82815180d630ac878e8db883b0', 'Regenerated GLB differs from approved asset'
          PY
      - name: Commit verified model to this feature branch
        run: |
          set -euo pipefail
          git add assets/models/radio_receiver tests/test_radio_receiver.py
          if [ -f tools/radio_receiver_source.tar.br.b64 ]; then
            git rm tools/radio_receiver_source.tar.br.b64
          fi
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'feat(assets): add verified SEVER FM receiver model and Godot scene'
          git push origin "HEAD:$GITHUB_REF_NAME"
